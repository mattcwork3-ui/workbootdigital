    <meta name="theme-color" content="#050d1f" />
    <link rel="icon" href="data:," />
    <title>Workboot Digital — Websites &amp; Google Listings for Calgary Trades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Structured data: LocalBusiness (ProfessionalService) + FAQ. Facts
         only — name, email, website, service area and the catalog
         services/prices. No phone, hours, street address, reviews or
         ratings: none exist to claim. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://workbootdigital.ca/#business",
          "name": "Workboot Digital",
          "url": "https://workbootdigital.ca",
          "email": "hello@workbootdigital.ca",
          "description": "Workboot Digital is a Calgary website studio for local trades and small businesses. We rebuild and refresh tired websites, build new sites from scratch, set up Google Business Profiles, and automate the busywork — enquiries, bookings and orders. We build first: send us your site details and we will build your $0 preview, no obligation. Nothing goes live until you approve it. Monthly care keeps it fresh — posts, listing updates and small edits handled for you.",
          "priceRange": "$99 - $799",
          "areaServed": [
            { "@type": "City", "name": "Calgary, Alberta" },
            { "@type": "City", "name": "Airdrie, Alberta" },
            { "@type": "City", "name": "Strathmore, Alberta" },
            { "@type": "City", "name": "Red Deer, Alberta" },
            { "@type": "City", "name": "Brooks, Alberta" },
            { "@type": "City", "name": "Cochrane, Alberta" },
            { "@type": "City", "name": "Chestermere, Alberta" }
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Website services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Makeover" }, "price": "399", "priceCurrency": "CAD" },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "New Website" }, "price": "799", "priceCurrency": "CAD" },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Google Business Profile Setup" }, "price": "99", "priceCurrency": "CAD" },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Automations" }, "price": "99.99", "priceCurrency": "CAD" },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Monthly Care & Content" }, "price": "199", "priceCurrency": "CAD" }
            ]
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://workbootdigital.ca/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does the free business checkup include?",
              "acceptedAnswer": { "@type": "Answer", "text": "A human look at your website and Google listing: what a customer sees, where the enquiry path breaks down, and one clear next step. We record only what we can observe — we never invent rankings, traffic or review counts." }
            },
            {
              "@type": "Question",
              "name": "Do I have to take a monthly plan?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. Monthly support is a separate, optional offer. You can buy a one-time service on its own, add support later, or never. Recurring selections are always off by default and need your explicit OK." }
            },
            {
              "@type": "Question",
              "name": "How does the $0 preview work for one-time services?",
              "acceptedAnswer": { "@type": "Answer", "text": "Pick a service and send us your info in the free checkup form — your site address, your Google profile link, or the workflow step you want automated. We build a mock preview for $0 and show it to you. There is no commitment, nothing is charged, and nothing goes live. If you decide to buy, 3 mods (changes) are included to fine-tune the mock into the finished thing." }
            },
            {
              "@type": "Question",
              "name": "Will buying a one-time service sign me up for monthly services?",
              "acceptedAnswer": { "@type": "Answer", "text": "No — never automatically, and nothing is pre-selected. At the buy stage we may show you the monthly extras that match what you bought, with their monthly prices listed separately from the one-time price. They are only ever added if you ask for a revised quote that includes them." }
            },
            {
              "@type": "Question",
              "name": "Who approves work before it goes live?",
              "acceptedAnswer": { "@type": "Answer", "text": "You do. Drafts, posts and website previews are sent to you to approve the exact version before anything is published. A website also needs your separate launch authorization before we publish it." }
            },
            {
              "@type": "Question",
              "name": "What is not included in the listed prices?",
              "acceptedAnswer": { "@type": "Answer", "text": "Hosting, domain names, software fees and applicable taxes are separate when they apply, and always shown separately on your quote. Extra pages, migrations and custom work are quoted before we start." }
            },
            {
              "@type": "Question",
              "name": "How much of the work is automated?",
              "acceptedAnswer": { "@type": "Answer", "text": "Most of the drafting is. Posts, listing updates, page wording and checkup drafts are prepared by software from your business details — that is how the prices stay low. A person checks every draft, and you approve the exact version before anything goes live. If a job can't be done well that way, we will say so instead of selling it." }
            },
            {
              "@type": "Question",
              "name": "Can you guarantee more calls or better rankings?",
              "acceptedAnswer": { "@type": "Answer", "text": "No — and be wary of anyone who does. We build solid foundations and keep your presence current; results depend on your market." }
            }
          ]
        }
      ]
    }
    </script>
    <style>
      /* Midnight blue — the site's only theme (locked, as in the preview):
         very dark blue background, electric-blue accents, near-white text,
         brand orange #ff7a1a for the logo arrow and the $0 subline. */
      :root {
        color-scheme: dark;
        --bg: #050d1f;
        --surface: #0a1830;
        --surface-alt: #081426;
        --text: #eef4ff;
        --text-2: #bccdea;
        --dim: #8499b8;
        --border: #1d3355;
        --accent: #2f7bff;
        --accent-hover: #5b97ff;
        --on-accent: #ffffff;
        --brand: #2f7bff;
        --brand-ink: #ffffff;
        --logo-boot: #5b97ff;
        --orange: #ff7a1a;
        --danger: #fca5a5;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      .font-display { font-family: "Archivo", system-ui, sans-serif; }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      img { max-width: 100%; }
      a { color: inherit; }
      .wrap { max-width: 72rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
      .wrap-narrow { max-width: 56rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* Header */
      .site-header { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--border); background: rgba(5, 13, 31, 0.95); backdrop-filter: blur(6px); }
      .site-header .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .header-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
      @media (min-width: 640px) { .header-actions { gap: 0.75rem; } }
      .brand-logo { font-family: "Archivo", system-ui, sans-serif; font-weight: 900; letter-spacing: -0.02em; display: inline-block; line-height: 1; }
      .brand-logo .w { color: var(--text); }
      .brand-logo .b { color: var(--logo-boot); }
      .logo-btn { background: none; border: none; padding: 0.25rem 0; cursor: pointer; text-align: left; min-height: 2.25rem; }
      .btn { display: inline-block; border-radius: 8px; font-family: "Archivo", system-ui, sans-serif; font-weight: 800; cursor: pointer; text-decoration: none; text-align: center; }
      .btn-accent { background: var(--accent); color: var(--on-accent); border: none; padding: 0.6rem 1.25rem; font-size: 1rem; white-space: nowrap; }
      .btn-accent:hover { background: var(--accent-hover); }
      .btn-outline { background: none; color: var(--text); border: 1px solid var(--text); padding: 0.6rem 1.25rem; font-size: 1rem; }
      .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
      .btn-sm { padding: 0.45rem 0.9rem; font-size: 0.875rem; }
      .btn-lg { padding: 0.8rem 1.4rem; font-size: 1rem; }

      /* Header menu dropdown */
      .menu-root { position: relative; flex-shrink: 0; }
      .menu-btn { display: flex; align-items: center; gap: 0.5rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); padding: 0.5rem 0.75rem; font-size: 0.875rem; font-weight: 700; color: var(--text); cursor: pointer; font-family: inherit; }
      .menu-btn:hover { border-color: var(--accent); color: var(--accent); }
      .menu-panel { position: absolute; right: 0; top: calc(100% + 0.5rem); z-index: 50; width: min(22rem, calc(100vw - 2rem)); overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); box-shadow: 0 20px 40px rgba(0,0,0,0.35); }
      .menu-scroll { max-height: min(72vh, 34rem); overflow-y: auto; padding: 0.5rem; }
      .menu-heading { padding: 0.5rem 0.75rem 0.25rem; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); margin: 0; }
      .menu-panel ul { list-style: none; margin: 0; padding: 0; }
      .menu-item { display: flex; width: 100%; align-items: center; gap: 0.75rem; border: none; background: none; border-radius: 8px; padding: 0.65rem 0.75rem; text-align: left; font-size: 0.875rem; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit; min-height: 2.75rem; }
      .menu-item:hover, .menu-item:focus-visible { background: var(--surface); outline: none; }
      .menu-item .grow { flex: 1; line-height: 1.35; }
      .menu-item .price { flex-shrink: 0; font-size: 0.75rem; font-weight: 700; color: var(--accent); }
      .menu-item .tag0 { flex-shrink: 0; border-radius: 4px; background: rgba(47,123,255,0.15); padding: 0.15rem 0.4rem; font-size: 11px; font-weight: 700; color: var(--accent); }
      .menu-item .sample { flex-shrink: 0; font-size: 0.75rem; font-weight: 700; color: var(--dim); }
      .menu-divider { margin: 0.5rem 0.75rem; border-top: 1px solid var(--border); }

      /* Sections & type */
      section.block { padding-top: 3rem; padding-bottom: 3rem; }
      .band { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface-alt); }
      .blueprint {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 44px 44px;
        border-bottom: 1px solid var(--border);
      }
      h1, h2, h3 { font-family: "Archivo", system-ui, sans-serif; margin: 0; }
      .h-hero { font-size: 1.875rem; font-weight: 900; line-height: 1.15; }
      @media (min-width: 768px) { .h-hero { font-size: 2.25rem; } }
      @media (min-width: 1024px) { .h-hero { font-size: 3rem; } }
      .h-hero .blue { color: var(--accent); }
      .subline { font-family: "Archivo", system-ui, sans-serif; font-size: 1.25rem; font-weight: 800; line-height: 1.3; color: var(--orange); margin: 0; }
      .h2 { font-size: 1.875rem; font-weight: 900; line-height: 1.2; }
      .h2-big { font-size: 2.25rem; font-weight: 900; line-height: 1.15; }
      @media (min-width: 768px) { .h2-big { font-size: 3rem; } }
      @media (min-width: 1024px) { .h2-big { font-size: 3.75rem; } }
      .kicker { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.22em; color: var(--accent); margin: 0; }
      .lede { color: var(--text-2); line-height: 1.6; }
      .small { font-size: 0.875rem; }
      .tiny { font-size: 0.75rem; }
      .dim { color: var(--dim); }
      .mt1 { margin-top: 0.5rem; } .mt2 { margin-top: 1rem; } .mt3 { margin-top: 1.5rem; } .mt4 { margin-top: 2rem; }

      /* Hero */
      .hero-grid { display: grid; gap: 2rem; align-items: center; padding-top: 2.5rem; padding-bottom: 2.5rem; }
      @media (min-width: 768px) { .hero-grid { grid-template-columns: 1fr 1fr; padding-top: 4rem; padding-bottom: 4rem; } }
      .hero-copy { display: flex; flex-direction: column; gap: 1.5rem; }
      .hero-ctas { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      .hero-figure { margin: 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); }
      .hero-figure .imgwrap { position: relative; }
      .hero-figure img { display: block; width: 100%; height: 18rem; object-fit: cover; }
      @media (min-width: 640px) { .hero-figure img { height: 24rem; } }
      @media (min-width: 1024px) { .hero-figure img { height: 28rem; } }
      .hero-banner { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(23, 24, 28, 0.85); backdrop-filter: blur(4px); padding: 0.75rem 1rem; }
      .hero-banner .k { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #f5a524; margin: 0; }
      .hero-banner .t { font-family: "Archivo", system-ui, sans-serif; margin: 0.25rem 0 0; font-size: 1.125rem; font-weight: 900; line-height: 1.3; color: #fff; }
      @media (min-width: 768px) { .hero-banner .t { font-size: 1.25rem; } }
      .hero-figure figcaption { background: var(--surface); padding: 0.5rem 1rem; font-size: 0.75rem; color: var(--dim); }

      /* Cards & grids */
      .card { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 1.25rem; }
      .grid { display: grid; gap: 1.25rem; }
      .grid-2 { grid-template-columns: 1fr; }
      @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
      .grid-3 { grid-template-columns: 1fr; }
      @media (min-width: 768px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
      .grid-4 { grid-template-columns: 1fr; }
      @media (min-width: 768px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
      .what-grid { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 0.75rem; grid-template-columns: 1fr; }
      @media (min-width: 640px) { .what-grid { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 1024px) { .what-grid { grid-template-columns: repeat(5, 1fr); } }
      .what-card { display: flex; flex-direction: column; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 1rem; }
      .what-card h3 { font-size: 1rem; font-weight: 800; color: var(--accent); }
      .what-card p { margin: 0.4rem 0 0; font-size: 0.875rem; line-height: 1.55; color: var(--text-2); }
      .what-card .badges { margin-top: auto; padding-top: 0.75rem; display: flex; align-items: center; }
      .marks { display: inline-flex; align-items: center; gap: 0.5rem; }
      .marks svg { display: block; }
      .stars { display: inline-flex; align-items: center; gap: 2px; }
      .why-box { margin-top: 1.5rem; border: 1px solid rgba(47,123,255,0.4); background: var(--surface); border-radius: 12px; padding: 1.25rem; }
      .why-box ul { margin: 0.5rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; font-size: 0.875rem; line-height: 1.55; color: var(--text-2); }
      @media (min-width: 640px) { .why-box ul { grid-template-columns: 1fr 1fr; } }
      .why-box b { color: var(--text); }

      /* One-time services */
      .featured-card { border: 2px solid var(--accent); background: var(--surface); border-radius: 12px; padding: 1.5rem; cursor: pointer; }
      .featured-card:hover { border-color: var(--accent-hover); }
      @media (min-width: 768px) { .featured-card { display: flex; gap: 2rem; } .featured-main { width: 66.66%; } .featured-side { width: 33.33%; margin-top: 0 !important; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; } }
      .featured-side { margin-top: 1.25rem; }
      .price-big { font-family: "Archivo", system-ui, sans-serif; font-size: 2.25rem; font-weight: 900; margin: 0; }
      .price-big .cad { font-size: 1rem; font-weight: 700; color: var(--dim); }
      .svc-grid { display: grid; gap: 1.25rem; grid-template-columns: 1fr; }
      @media (min-width: 768px) { .svc-grid { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 1280px) { .svc-grid { grid-template-columns: repeat(4, 1fr); } }
      .svc-card { display: flex; flex-direction: column; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 1.25rem; cursor: pointer; }
      .svc-card:hover { border-color: var(--accent); }
      .svc-price { font-family: "Archivo", system-ui, sans-serif; margin-top: 0.5rem; font-size: 1.875rem; font-weight: 900; color: var(--accent); }
      .svc-price .from { font-size: 0.875rem; font-weight: 700; color: var(--dim); vertical-align: middle; margin-right: 0.25rem; }
      .svc-price .cad { font-size: 0.875rem; font-weight: 700; color: var(--dim); }
      .chip0 { align-self: flex-start; border-radius: 4px; background: rgba(47,123,255,0.15); padding: 0.25rem 0.5rem; font-size: 0.75rem; font-weight: 700; color: var(--accent); }
      .gbp-plate { display: inline-flex; align-items: center; gap: 0.6rem; border-radius: 8px; background: #fff; padding: 0.5rem 0.75rem; color: #3c4043; font-family: "Archivo", system-ui, sans-serif; }
      .gbp-plate .t1 { font-size: 0.95rem; font-weight: 700; line-height: 1.1; color: #3c4043; }
      .gbp-plate .t2 { font-size: 0.8rem; font-weight: 600; line-height: 1.1; color: #5f6368; }

      /* How it works */
      .step-card h3 { font-size: 1.125rem; font-weight: 800; color: var(--accent); }
      .step-card p { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.55; color: var(--text-2); }
      .quote-figure { margin: 2rem 0 0; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); }
      @media (min-width: 768px) { .quote-figure { display: flex; } .quote-figure img { width: 40%; height: auto; } }
      .quote-figure img { display: block; width: 100%; height: 14rem; object-fit: cover; }
      .quote-figure blockquote { margin: 0; display: flex; flex-direction: column; justify-content: center; background: var(--surface); padding: 1.5rem; flex: 1; }
      .quote-figure blockquote p { font-family: "Archivo", system-ui, sans-serif; font-size: 1.25rem; font-weight: 700; line-height: 1.35; margin: 0; }
      .quote-figure cite { margin-top: 0.75rem; font-size: 0.875rem; font-style: normal; color: var(--dim); }

      /* Demos */
      .demo-card { overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
      .demo-card img { display: block; width: 100%; height: 11rem; object-fit: cover; }
      .demo-card .body { padding: 1.25rem; }
      .demo-chip { border-radius: 4px; padding: 0.15rem 0.5rem; font-size: 0.75rem; font-weight: 700; color: #fff; }
      .fictional-tag { border-radius: 4px; background: var(--border); padding: 0.25rem 0.5rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); }

      /* Monthly picker */
      .plan-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; margin-top: 1rem; }
      @media (min-width: 768px) { .plan-grid { grid-template-columns: repeat(4, 1fr); } }
      .plan-card { display: block; cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 1rem; }
      .plan-card.selected { border-color: var(--accent); background: var(--bg); }
      .plan-card input { accent-color: var(--accent); margin-right: 0.5rem; }
      .plan-name { font-family: "Archivo", system-ui, sans-serif; font-weight: 800; }
      .plan-scope { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.55; color: var(--text-2); }
      .plan-stats { margin-top: 0.5rem; border-radius: 6px; background: var(--surface); padding: 0.3rem 0.5rem; font-size: 0.75rem; font-weight: 600; color: var(--accent); }
      .plan-card.selected .plan-stats { background: var(--surface); }
      .plan-limits { margin-top: 0.5rem; font-size: 0.75rem; color: var(--dim); }
      .plan-price { font-family: "Archivo", system-ui, sans-serif; margin: 0.75rem 0 0; font-size: 1.5rem; font-weight: 900; color: var(--accent); }
      .plan-price .per { font-size: 0.875rem; color: var(--dim); font-weight: 700; }
      .plan-price.plain { color: var(--text); }
      .addon-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; margin-top: 1rem; }
      @media (min-width: 768px) { .addon-grid { grid-template-columns: 1fr 1fr; } }
      fieldset.addon-cat { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 1rem; margin: 0; }
      fieldset.addon-cat legend { padding: 0 0.25rem; font-family: "Archivo", system-ui, sans-serif; font-size: 0.875rem; font-weight: 800; letter-spacing: 0.03em; color: var(--accent); }
      .addon-row { display: flex; cursor: pointer; align-items: flex-start; gap: 0.75rem; border-radius: 8px; padding: 0.5rem; margin-top: 0.25rem; }
      .addon-row:hover { background: var(--bg); }
      .addon-row input { margin-top: 0.2rem; width: 1.25rem; height: 1.25rem; accent-color: var(--accent); flex-shrink: 0; }
      .addon-row .grow { flex: 1; }
      .addon-row .scope { display: block; font-size: 0.875rem; color: var(--dim); }
      .addon-row .price { font-family: "Archivo", system-ui, sans-serif; font-weight: 800; white-space: nowrap; }
      .addon-row .price .per { font-size: 0.75rem; color: var(--dim); font-weight: 700; }
      .total-bar { margin-top: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; border: 1px solid var(--accent); background: var(--bg); border-radius: 12px; padding: 1.25rem; }

      s.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebPage", name: town.title, description: town.description, about: { "@type": "City", name: town.name + ", Alberta" } },

        ]
      });
      document.head.appendChild(s);

    function parseHash() {
      var h = (location.hash || "#/").replace(/^#\/?/, "");
      var parts = h.split("/").filter(Boolean);
      if (parts.length === 0) return { name: "home" };
      if (parts[0] === "sitemap") return { name: "sitemap" };
      if (parts[0] === "demo" && parts[1]) return { name: "demo", id: parts[1] };
      for (var sid in SERVICE_PATH) { if (SERVICE_PATH[sid] === parts[0]) return { name: "service", id: sid }; }
      for (var i = 0; i < TOWNS.length; i++) { if (TOWNS[i].id === parts[0]) return { name: "town", id: parts[0] }; }
      return { name: "home" };
    }
    function hashFor(route) {
      if (route.name === "home") return "#/";
      if (route.name === "sitemap") return "#/sitemap";
      if (route.name === "demo") return "#/demo/" + route.id;
      if (route.name === "service") return "#/" + SERVICE_PATH[route.id];
      if (route.name === "town") return "#/" + route.id;
      return "#/";
    }
    function go(route) {
      var target = hashFor(route);
      if (location.hash === target) { render(); } else { location.hash = target; }
    }
    function goSection(id) {
      if (currentRoute.name !== "home") {
        pendingSection = id;
        go({ name: "home" });
      } else {
        scrollToId(id);
      }
    }
    function scrollToId(id) {
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function render() {
      var route = parseHash();
      currentRoute = route;
      clearTownSeo();
      if (route.name === "demo") {
        setMeta("Contractor Website Demos | Workboot Digital", "Three fictional contractor demo websites — Summit Roofing, Evergreen Outdoor Co. and FixRight Home Services — built by Workboot Digital to show what a contractor site can do.");
        app.innerHTML = demoStudioView(route.id);

        setMeta(SERVICE_TITLE[route.id] || HOME_TITLE, SERVICE_DESC[route.id] || HOME_DESC);
        app.innerHTML = serviceView(route.id);
        initShowcase();

        var town = TOWNS.filter(function (t) { return t.id === route.id; })[0] || TOWNS[0];
        setMeta(town.title, town.description);
        setTownSeo(town);

        app.innerHTML = sitemapView();
      } else {
        setMeta(HOME_TITLE, HOME_DESC);
        app.innerHTML = homeView();
        syncPickerUI();
      }

        var id = pendingSection;
        pendingSection = null;
        setTimeout(function () { scrollToId(id); }, 60);

    /* ============ Header menu wiring ============ */
    function closeMenu() {
      var panel = document.getElementById("site-header-menu");
      var btn = document.getElementById("menu-btn");
      if (panel) panel.hidden = true;
      if (btn) { btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-label", "Open menu"); }
    }
    document.addEventListener("click", function (e) {
      var menuBtn = e.target.closest("#menu-btn");
      if (menuBtn) {
        var panel = document.getElementById("site-header-menu");
        var open = panel && !panel.hidden;
        if (panel) panel.hidden = !!open;
        menuBtn.setAttribute("aria-expanded", open ? "false" : "true");
        menuBtn.setAttribute("aria-label", open ? "Open menu" : "Close menu");
        return;
      }
      var root = document.getElementById("menu-root");
      if (root && !root.contains(e.target)) closeMenu();
    });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });

    /* ============ Nav delegation ============ */
    document.addEventListener("click", function (e) {
      var card = e.target.closest(".svc-card, .featured-card");
      if (card && !e.target.closest("button")) {
        go({ name: "service", id: card.getAttribute("data-id") });
        return;
      }
      var el = e.target.closest("[data-nav]");
      if (el) {
        var nav = el.getAttribute("data-nav");
        closeMenu();
        if (nav === "home") go({ name: "home" });
        else if (nav === "service") go({ name: "service", id: el.getAttribute("data-id") });
        else if (nav === "town") go({ name: "town", id: el.getAttribute("data-id") });
        else if (nav === "demo") go({ name: "demo", id: el.getAttribute("data-id") });
        else if (nav === "sitemap") go({ name: "sitemap" });
        else if (nav === "section") goSection(el.getAttribute("data-section") || el.getAttribute("data-id"));
        return;
      }
      var st = e.target.closest("[data-scrollto]");
      if (st) scrollToId(st.getAttribute("data-scrollto"));
    });

        phone: fieldVal(form, "phone"),

      if (!v.trade) missing.push("your trade or type of business");
      if (!v.goal) missing.push("your main goal");

        formMsg(form, "A couple of details are still missing: " + missing.join(", ") + ". Fill those in and press the button again — nothing has been sent yet.", true);

        var consent = form.querySelector('[data-f="recurringConsent"]');
        if (consent && !consent.checked) {
          formMsg(form, "You picked monthly services in the picker — please tick the recurring-services OK in the form, or clear the monthly selections in the picker above. Nothing has been sent yet.", true);
          return;
        }
      }
      var marketing = form.querySelector('[data-f="marketingConsent"]');
      var lines = [
        "Free Business Checkup request — Workboot Digital",
        "",
        "Your name: " + v.contactName,
        "Business name: " + v.businessName,
        "Email: " + v.email,
        "Phone: " + (v.phone || "(not given)"),
        "Service area: " + v.serviceArea,
        "Trade / type of business: " + v.trade,
        "Website or Google listing link: " + (v.website || "(none)"),
        "",
        "Main goal:",
        v.goal
      ];
      if (parts.length) {
        lines.push("", "Monthly services picked in the picker (estimates only — please quote me):", parts.join("\n"));
        lines.push("Recurring services OK: yes, I am OK being quoted for these. I understand no subscription starts from this email.");
      }
      lines.push("", "Occasional tips and offers by email: " + (marketing && marketing.checked ? "yes" : "no — contact me about this checkup only"));
      var subject = "Free Business Checkup — " + v.businessName;
      var href = "mailto:hello@workbootdigital.ca?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(lines.join("\n"));
      formMsg(form, "<b>Your email app should now open</b> with this request addressed to hello@workbootdigital.ca and filled in — just press send in your email to deliver it. If nothing opened, email us directly at <b>hello@workbootdigital.ca</b> with the same details.", false);
      window.location.href = href;
    }

    /* ============ Demo quote form → on-device summary ============ */
    function submitDemoQuote(form) {
      var demoId = form.getAttribute("data-demo-form");
      var demo = DEMOS.filter(function (d) { return d.id === demoId; })[0] || DEMOS[0];
      var fd = new FormData(form);
      var card = form.closest(".quote-card");
      var photoCount = card ? card.getAttribute("data-photo-count") || "0" : "0";
      var text = [
        "DEMO QUOTE REQUEST — " + demo.business,
        "Name: " + (fd.get("name") || ""),
        "Phone: " + (fd.get("phone") || ""),
        "Email: " + (fd.get("email") || ""),
        "Service: " + (fd.get("service") || ""),
        "Timing: " + (fd.get("timing") || ""),
        "Area: " + (fd.get("location") || ""),
        "Details: " + (fd.get("details") || ""),
        "Photos selected: " + photoCount
      ].join("\n");
      var holder = form.parentElement.querySelector("[data-demo-summary]");
      if (holder) {
        holder.innerHTML = '<div class="quote-summary" role="status"><p>Demo request prepared. Nothing has been submitted or saved.</p><pre></pre>' +
          '<button type="button" class="demo-cta" style="background:' + demo.accent + ';margin-top:0.75rem" data-copy-summary>Copy Request Summary</button></div>';
        holder.querySelector("pre").textContent = text;
        var btn = holder.querySelector("[data-copy-summary]");
        btn.addEventListener("click", function () {
          function done(ok) { btn.textContent = ok ? "Copied!" : "Select the summary above and copy it"; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
          } else { done(false); }
        });
      }
    }

    /* ============ FlowRight showcase wiring ============ */
    var mbsState = { view: "drag", pct: 50 };
    function initShowcase() {
      var stage = document.querySelector("[data-mbs-stage]");
      if (!stage) return;
      stage.innerHTML = mbsStageHTML(mbsState.view, mbsState.pct);
      wireWipe(stage);
    }
    function wireWipe(stage) {
      var wipe = stage.querySelector("[data-mbs-wipe]");
      if (!wipe) return;
      var top = wipe.querySelector("[data-mbs-top]");
      var edge = wipe.querySelector("[data-mbs-edge]");
      var shine = wipe.querySelector("[data-mbs-shine]");
      var handle = wipe.querySelector("[data-mbs-handle]");
      var knob = wipe.querySelector("[data-mbs-knob]");
      var range = stage.querySelector("[data-mbs-range]");
      var dragging = false;
      function setPct(clientX) {
        var r = wipe.getBoundingClientRect();
        var pct = Math.max(0, Math.min(100, ((clientX - r.left) / r.width) * 100));
        mbsState.pct = pct;
        top.style.clipPath = "inset(0 0 0 " + pct + "%)";
        edge.style.left = pct + "%"; shine.style.left = pct + "%";
        handle.style.left = pct + "%"; knob.style.left = pct + "%";
        if (range) range.value = Math.round(pct);
      }
      wipe.addEventListener("pointerdown", function (e) {
        dragging = true; wipe.classList.add("is-dragging");
        try { wipe.setPointerCapture(e.pointerId); } catch (err) {}
        setPct(e.clientX);
      });
      wipe.addEventListener("pointermove", function (e) { if (dragging) setPct(e.clientX); });
      function end() { dragging = false; wipe.classList.remove("is-dragging"); }
      wipe.addEventListener("pointerup", end);
      wipe.addEventListener("pointercancel", end);
      if (range) {
        range.addEventListener("input", function () {
          mbsState.pct = Number(range.value);
          top.style.clipPath = "inset(0 0 0 " + mbsState.pct + "%)";
          edge.style.left = mbsState.pct + "%"; shine.style.left = mbsState.pct + "%";
          handle.style.left = mbsState.pct + "%"; knob.style.left = mbsState.pct + "%";
        });
      }
    }
    document.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-mbs-view]");
      if (!btn) return;
      mbsState.view = btn.getAttribute("data-mbs-view");
      document.querySelectorAll("[data-mbs-view]").forEach(function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      var stage = document.querySelector("[data-mbs-stage]");
      if (stage) { stage.innerHTML = mbsStageHTML(mbsState.view, mbsState.pct); wireWipe(stage); }
    });

    window.addEventListener("hashchange", render);
    render();
    </script>
  </body>
</html>
